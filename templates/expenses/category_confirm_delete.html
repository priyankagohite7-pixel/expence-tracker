{% extends 'base.html' %}
{% block title %}Delete Category | Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white fw-semibold">Delete Category</div>
      <div class="card-body">
        <p>Delete category <strong>{{ category.name }}</strong>? Expenses in this category will become uncategorised.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button class="btn btn-danger" type="submit"><i class="bi bi-trash me-1"></i> Delete</button>
            <a href="{% url 'expenses:categories' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
