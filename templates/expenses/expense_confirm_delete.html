{% extends 'base.html' %}
{% block title %}Delete Expense | Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white fw-semibold">Delete Expense</div>
      <div class="card-body">
        <p>Are you sure you want to delete <strong>{{ expense.title }}</strong> (Rs.{{ expense.amount }})?</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button class="btn btn-danger" type="submit"><i class="bi bi-trash me-1"></i> Delete</button>
            <a href="{% url 'expenses:list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
