{% extends 'base.html' %}
{% block title %}Delete Budget | Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white fw-semibold">Remove Budget</div>
      <div class="card-body">
        <p>Remove budget for <strong>{{ budget.category }}</strong> ({{ budget.month|date:"M Y" }})?</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button class="btn btn-danger" type="submit"><i class="bi bi-trash me-1"></i> Remove</button>
            <a href="{% url 'expenses:budgets' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
