{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Register | Expense Tracker{% endblock %}

{% block auth_content %}
<div class="card shadow-sm">
  <div class="card-body p-4">
    <h4 class="text-center mb-4"><i class="bi bi-wallet2 me-2 text-primary"></i>Create Account</h4>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-success w-100 mt-2" type="submit">
        <i class="bi bi-person-plus me-1"></i> Register
      </button>
    </form>
    <p class="text-center mt-3 mb-0 small">
      Already registered? <a href="{% url 'accounts:login' %}">Log in</a>
    </p>
  </div>
</div>
{% endblock auth_content %}
