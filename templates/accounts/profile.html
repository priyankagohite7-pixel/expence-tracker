{% extends 'base.html' %}
{% block title %}Profile | Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-transparent fw-semibold">My Profile</div>
      <div class="card-body">
        <p><strong>Username:</strong> {{ user.username }}</p>
        <p><strong>Name:</strong> {{ user.get_full_name|default:"—" }}</p>
        <p><strong>Email:</strong> {{ user.email|default:"—" }}</p>
        <p><strong>Member since:</strong> {{ user.date_joined|date:"d M Y" }}</p>
        <a href="{% url 'accounts:logout' %}" class="btn btn-outline-danger mt-2">
          <i class="bi bi-box-arrow-left me-1"></i> Logout
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
